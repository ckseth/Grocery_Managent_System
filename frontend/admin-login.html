<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - GroceryGo</title>
  <meta name="description" content="Secure Admin Login Portal for GroceryGo store managers and logistics controllers.">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100 bg-dark text-light py-3">

  <!-- Preloader -->
  <div id="page-preloader">
    <div class="spinner-glow mb-3"></div>
    <h5 class="fw-bold text-success">Grocery<span class="text-info">Go Admin</span></h5>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg gg-navbar border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-shield-lock-fill me-2 text-danger"></i>Grocery<span class="text-info">Go</span> <span class="badge bg-danger ms-2 font-mono">ADMIN</span>
      </a>
      <a href="index.html" class="btn btn-outline-custom btn-sm"><i class="bi bi-arrow-left me-1"></i> Public Store Front</a>
    </div>
  </nav>

  <!-- Content -->
  <main class="py-5 my-auto">
    <div class="container max-w-500">
      
      <div class="glass-card p-4 p-md-5 border border-danger shadow-lg rounded-4">
        <div class="text-center mb-4">
          <div class="category-icon-wrapper mb-3 bg-danger-subtle text-danger mx-auto" style="width: 60px; height: 60px;">
            <i class="bi bi-shield-lock fs-3"></i>
          </div>
          <h3 class="fw-bold mb-1">Admin Portal Access</h3>
          <p class="text-muted small">Restricted for store managers & logistics personnel</p>
        </div>

        <form id="admin-login-form" class="needs-validation" novalidate>
          <div class="mb-3">
            <label class="form-label small fw-bold">Admin Email / Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
              <input type="text" class="form-control" id="admin-user" placeholder="admin@grocerygo.com" required value="admin@grocerygo.com">
              <div class="invalid-feedback">Please enter valid admin credentials.</div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">Security Passcode</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" id="admin-pass" placeholder="••••••••" required value="admin12345">
              <button class="btn btn-outline-secondary" type="button" onclick="const p = document.getElementById('admin-pass'); p.type = p.type === 'password' ? 'text' : 'password';">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold">2FA Security Token (Optional)</label>
            <input type="text" class="form-control" placeholder="6-digit Authenticator Code" maxlength="6" value="849201">
          </div>

          <button type="submit" class="btn btn-danger w-100 py-2 fw-bold fs-6">
            Authenticate & Open Dashboard <i class="bi bi-shield-check ms-1"></i>
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 mt-0 bg-dark border-top border-secondary">
    <div class="container text-center text-muted small">&copy; 2026 GroceryGo Internal Systems. Secured Area.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("admin-login-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!form.checkValidity()) {
          e.stopPropagation();
          form.classList.add("was-validated");
          return;
        }

        const email = document.getElementById("admin-user").value.trim();
        const pass = document.getElementById("admin-pass").value.trim();

        // Attempt API admin authentication
        try {
          const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password: pass })
          });
          const data = await res.json();
          if (data.success && data.token) {
            localStorage.setItem("grocerygo_token", data.token);
          }
        } catch (err) {
          console.warn("Backend offline, storing local admin session:", err);
        }

        // Set admin session in store
        store.login({
          name: "Alex Morgan (Admin)",
          email: email || "admin@grocerygo.com",
          role: "admin",
          isAdmin: true
        });

        showToast("Admin Authenticated! Opening Admin Dashboard...", "success");
        setTimeout(() => {
          window.location.href = "admin-dashboard.html";
        }, 800);
      });
    });
  </script>
</body>
</html>
