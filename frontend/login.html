<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Sign In - GroceryGo</title>
  <meta name="description" content="Sign in to your GroceryGo account to enjoy 10-minute organic grocery delivery and order tracking.">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page-wrapper">

  //floating animating
  <div class="auth-blob auth-blob-1"></div>
  <div class="auth-blob auth-blob-2"></div>

  // Preloader 
  <div id="page-preloader">
    <div class="spinner-glow mb-3"></div>
    <h5 class="fw-bold text-success">Grocery<span class="text-info">Go</span></h5>
  </div>

  <div class="auth-card-advanced">
    
    <div class="d-flex align-items-center justify-content-between mb-4">
      <a class="navbar-brand d-flex align-items-center m-0" href="index.html">
        <i class="bi bi-cart-emerald me-2 text-success fs-3"></i>Grocery<span class="text-info">Go</span>
      </a>
      <a href="index.html" class="btn btn-outline-custom btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Home
      </a>
    </div>

    <div class="auth-tab-switch">
      <a href="login.html" class="auth-tab-btn active"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</a>
      <a href="register.html" class="auth-tab-btn"><i class="bi bi-person-plus me-1"></i> Sign Up</a>
    </div>

    <!-- Header Text -->
    <div class="text-center mb-4">
      <h3 class="fw-bold mb-1 font-heading">Welcome Back</h3>
      <p class="text-muted small">Access your organic cart, express orders & rewards</p>
    </div>

    <!-- Form -->
    <form id="login-form" class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="login-email" class="form-label small fw-bold">Email Address</label>
        <div class="auth-input-group">
          <i class="bi bi-envelope auth-input-icon"></i>
          <input type="email" class="form-control" id="login-email" name="email" placeholder="sarah.miller@example.com" required value="sarah.miller@example.com" aria-label="Email Address">
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="login-password" class="form-label small fw-bold mb-0">Password</label>
          <a href="#" class="small text-success fw-semibold text-decoration-none" onclick="showToast('Password reset link sent to your email!', 'info'); return false;">Forgot Password?</a>
        </div>
        <div class="auth-input-group">
          <i class="bi bi-lock auth-input-icon"></i>
          <input type="password" class="form-control" id="login-password" name="password" placeholder="••••••••" required value="password123" aria-label="Password">
          <button class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted me-2" type="button" aria-label="Toggle password visibility" onclick="const p = document.getElementById('login-password'); p.type = p.type === 'password' ? 'text' : 'password';">
            <i class="bi bi-eye"></i>
          </button>
          <div class="invalid-feedback">Please enter your password.</div>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember-me" name="remember" checked>
        <label class="form-check-label small text-muted" for="remember-me">Keep me signed in</label>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-3 fw-bold fs-6 mb-3">
        Sign In to Account <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </form>

    <!-- Social Logins -->
    <div class="d-flex align-items-center my-3 text-muted small">
      <div class="flex-grow-1 border-top"></div>
      <span class="px-3">or continue with</span>
      <div class="flex-grow-1 border-top"></div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <button type="button" class="social-btn" onclick="showToast('Google login simulated successfully!', 'success'); store.login({name: 'Sarah Miller', email: 'sarah.miller@example.com'}); setTimeout(() => window.location.href='index.html', 1000);">
          <i class="bi bi-google text-danger"></i> Google
        </button>
      </div>
      <div class="col-6">
        <button type="button" class="social-btn" onclick="showToast('Apple ID login simulated successfully!', 'success'); store.login({name: 'Sarah Miller', email: 'sarah.miller@example.com'}); setTimeout(() => window.location.href='index.html', 1000);">
          <i class="bi bi-apple"></i> Apple
        </button>
      </div>
    </div>

    <!-- Admin Link -->
    <div class="text-center pt-2 border-top">
      <a href="admin-login.html" class="small text-muted text-decoration-none"><i class="bi bi-shield-lock me-1"></i> Admin Portal Login</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loginForm = document.getElementById("login-form");
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value.trim();
        if (email) {
          const name = email.split("@")[0].replace(".", " ");
          const formattedName = name.charAt(0).toUpperCase() + name.slice(1);
          store.login({ name: formattedName, email, role: "customer" });
          showToast(`Welcome back, <strong>${formattedName}</strong>!`, "success");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        }
      });
    });
  </script>
</body>
</html>
