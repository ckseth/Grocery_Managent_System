<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Method - GroceryGo</title>
  <meta name="description" content="Choose your payment method - Credit Card, UPI, Apple Pay, or Cash on Delivery at GroceryGo.">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Preloader -->
  <div id="page-preloader">
    <div class="spinner-glow mb-3"></div>
    <h5 class="fw-bold text-success">Grocery<span class="text-info">Go</span></h5>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top gg-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center me-4" href="index.html">
        <i class="bi bi-cart-emerald me-2 text-success"></i>Grocery<span class="text-info">Go</span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span class="badge bg-soft-primary px-3 py-2"><i class="bi bi-shield-lock me-1"></i> 256-bit Encrypted Payment</span>
      </div>
    </div>
  </nav>

  <!-- Progress Bar -->
  <section class="bg-light py-3 border-bottom">
    <div class="container max-w-800">
      <div class="d-flex justify-content-between align-items-center text-center">
        <div class="fw-bold text-success"><i class="bi bi-check-circle-fill me-1"></i> 1. Cart</div>
        <div class="fw-bold text-success"><i class="bi bi-check-circle-fill me-1"></i> 2. Delivery Address</div>
        <div class="fw-bold text-primary"><i class="bi bi-credit-card me-1"></i> 3. Payment</div>
      </div>
    </div>
  </section>

  <!-- Content -->
  <main class="py-5">
    <div class="container">
      <div class="row g-4 justify-content-center">
        
        <div class="col-lg-8">
          <div class="glass-card p-4">
            <h4 class="fw-bold mb-4"><i class="bi bi-wallet2 text-success me-2"></i>Select Payment Method</h4>

            <!-- Payment Methods Accordion / Tabs -->
            <div class="accordion" id="paymentAccordion">
              
              <!-- Option 1: Credit / Debit Card -->
              <div class="accordion-item glass-card mb-3 border">
                <h2 class="accordion-header">
                  <button class="accordion-button fw-bold text-main" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCard" aria-expanded="true">
                    <i class="bi bi-credit-card-2-front fs-5 text-success me-2"></i> Credit or Debit Card
                  </button>
                </h2>
                <div id="collapseCard" class="accordion-collapse collapse show" data-bs-parent="#paymentAccordion">
                  <div class="accordion-body">
                    <form id="card-payment-form">
                      <div class="row g-3">
                        <div class="col-12">
                          <label class="form-label small fw-bold">Cardholder Name</label>
                          <input type="text" class="form-control" placeholder="Sarah Miller" required value="Sarah Miller">
                        </div>
                        <div class="col-12">
                          <label class="form-label small fw-bold">Card Number</label>
                          <div class="input-group">
                            <input type="text" class="form-control" placeholder="4532 •••• •••• 8921" required value="4532 8901 2345 8921">
                            <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
                          </div>
                        </div>
                        <div class="col-md-6">
                          <label class="form-label small fw-bold">Expiry Date</label>
                          <input type="text" class="form-control" placeholder="MM/YY" required value="08/28">
                        </div>
                        <div class="col-md-6">
                          <label class="form-label small fw-bold">CVV Security Code</label>
                          <input type="password" class="form-control" placeholder="•••" maxlength="4" required value="842">
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>

              <!-- Option 2: UPI / Digital Wallet -->
              <div class="accordion-item glass-card mb-3 border">
                <h2 class="accordion-header">
                  <button class="accordion-button collapsed fw-bold text-main" type="button" data-bs-toggle="collapse" data-bs-target="#collapseUPI">
                    <i class="bi bi-qr-code-scan fs-5 text-info me-2"></i> UPI / Apple Pay / Google Pay
                  </button>
                </h2>
                <div id="collapseUPI" class="accordion-collapse collapse" data-bs-parent="#paymentAccordion">
                  <div class="accordion-body">
                    <div class="form-check mb-2">
                      <input class="form-check-input" type="radio" name="upiOption" id="upi1" checked>
                      <label class="form-check-label fw-semibold" for="upi1"><i class="bi bi-google me-1 text-danger"></i> Google Pay</label>
                    </div>
                    <div class="form-check mb-2">
                      <input class="form-check-input" type="radio" name="upiOption" id="upi2">
                      <label class="form-check-label fw-semibold" for="upi2"><i class="bi bi-apple me-1 text-dark"></i> Apple Pay</label>
                    </div>
                    <div class="form-check mb-3">
                      <input class="form-check-input" type="radio" name="upiOption" id="upi3">
                      <label class="form-check-label fw-semibold" for="upi3"><i class="bi bi-phone me-1 text-primary"></i> Virtual UPI ID (username@upi)</label>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Option 3: Cash on Delivery -->
              <div class="accordion-item glass-card mb-3 border">
                <h2 class="accordion-header">
                  <button class="accordion-button collapsed fw-bold text-main" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCOD">
                    <i class="bi bi-cash-stack fs-5 text-warning me-2"></i> Cash / Card on Delivery (COD)
                  </button>
                </h2>
                <div id="collapseCOD" class="accordion-collapse collapse" data-bs-parent="#paymentAccordion">
                  <div class="accordion-body">
                    <p class="text-muted small mb-0">Pay with exact cash or tap your credit/debit card on the driver's wireless POS machine upon delivery.</p>
                  </div>
                </div>
              </div>

            </div>

            <!-- Grand Total Bar & Confirm Button -->
            <div class="mt-4 p-3 bg-light rounded-3 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
              <div>
                <span class="text-muted small">Total Payable Amount:</span>
                <div class="fw-bold fs-4 text-success" id="pay-total-amount">₹0.00</div>
              </div>

              <button id="complete-order-btn" class="btn btn-primary-custom btn-lg px-5">
                <i class="bi bi-check-circle me-2"></i> Place Order Now
              </button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container text-center text-muted small">&copy; 2026 GroceryGo Inc. All rights reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cart = store.getCart();
      if (cart.length === 0) {
        window.location.href = "cart.html";
        return;
      }

      const totals = store.getCartTotals();
      document.getElementById("pay-total-amount").textContent = `₹${totals.grandTotal}`;

      const completeBtn = document.getElementById("complete-order-btn");

      completeBtn.addEventListener("click", () => {
        completeBtn.disabled = true;
        completeBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Processing Payment...`;

        setTimeout(() => {
          const pendingAddressStr = localStorage.getItem("grocerygo_pending_address");
          const addressObj = pendingAddressStr ? JSON.parse(pendingAddressStr) : {
            name: "Sarah Miller",
            address: "742 Evergreen Terrace, Springfield"
          };

          const selectedMethod = document.querySelector("#paymentAccordion .accordion-collapse.show")?.id || "Credit Card";
          const methodTitle = selectedMethod.includes("UPI") ? "UPI / Digital Wallet" : selectedMethod.includes("COD") ? "Cash on Delivery" : "Credit Card (•••• 8921)";

          const newOrder = store.createOrder(addressObj, methodTitle);

          showToast("Order placed successfully!", "success");
          window.location.href = "order-success.html";
        }, 1500);
      });
    });
  </script>
</body>
</html>
