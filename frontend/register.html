<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Free Account | GroceryGo</title>
  <meta name="description" content="Sign up for a new GroceryGo account to order 100% organic farm groceries delivered to your doorstep in 10 mins.">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .auth-card-enhanced {
      max-width: 480px;
      margin: 2rem auto;
      background: var(--bs-body-bg, #ffffff);
      border-radius: 1.25rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      padding: 2.25rem;
      position: relative;
      z-index: 10;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .auth-input-group {
      position: relative;
    }
    .auth-input-group .form-control {
      padding-left: 2.75rem;
      padding-right: 2.75rem;
      border-radius: 0.75rem;
      height: 48px;
    }
    .auth-input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #6c757d;
      z-index: 5;
      font-size: 1.1rem;
    }
    .auth-toggle-pass {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #6c757d;
      z-index: 5;
      cursor: pointer;
    }
  </style>
</head>
<body class="auth-page-wrapper">

  <!-- Floating Background Blobs -->
  <div class="auth-blob auth-blob-1"></div>
  <div class="auth-blob auth-blob-2"></div>

  <!-- Preloader -->
  <div id="page-preloader">
    <div class="spinner-glow mb-3"></div>
    <h5 class="fw-bold text-success">Grocery<span class="text-info">Go</span></h5>
  </div>

  <!-- Main Container -->
  <div class="auth-card-enhanced">
    
    <!-- Top Brand Logo & Back Home -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <a class="navbar-brand d-flex align-items-center m-0 fw-bold fs-4" href="index.html">
        <i class="bi bi-cart-emerald me-2 text-success fs-3"></i>Grocery<span class="text-info">Go</span>
      </a>
      <a href="index.html" class="btn btn-outline-custom btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Home
      </a>
    </div>

    <!-- Tab Switcher (Sign In vs Register) -->
    <div class="auth-tab-switch mb-4">
      <a href="login.html" class="auth-tab-btn"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</a>
      <a href="register.html" class="auth-tab-btn active"><i class="bi bi-person-plus me-1"></i> Sign Up</a>
    </div>

    <!-- Header Text -->
    <div class="text-center mb-4">
      <h3 class="fw-bold mb-1 font-heading">Create Customer Account</h3>
      <p class="text-muted small">Enjoy 10-Minute Express Delivery on all organic groceries</p>
    </div>

    <!-- Alert Message Box -->
    <div id="alert-msg-box" class="alert d-none py-2 px-3 small rounded-3 mb-3"></div>

    <!-- Form -->
    <form id="register-form" novalidate>
      <div class="mb-3">
        <label for="reg-name" class="form-label small fw-bold">Full Name</label>
        <div class="auth-input-group">
          <i class="bi bi-person auth-input-icon"></i>
          <input type="text" class="form-control" id="reg-name" name="fullname" placeholder="Sarah Miller" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-email" class="form-label small fw-bold">Email Address</label>
        <div class="auth-input-group">
          <i class="bi bi-envelope auth-input-icon"></i>
          <input type="email" class="form-control" id="reg-email" name="email" placeholder="sarah.miller@example.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-phone" class="form-label small fw-bold">Phone Number</label>
        <div class="auth-input-group">
          <i class="bi bi-telephone auth-input-icon"></i>
          <input type="tel" class="form-control" id="reg-phone" name="phone" placeholder="+91 98765 43210" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-password" class="form-label small fw-bold">Password</label>
        <div class="auth-input-group">
          <i class="bi bi-lock auth-input-icon"></i>
          <input type="password" class="form-control" id="reg-password" name="password" placeholder="••••••••" required minlength="6">
          <button type="button" class="auth-toggle-pass" onclick="togglePasswordVisibility('reg-password', this)" title="Toggle Password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-confirm-password" class="form-label small fw-bold">Confirm Password</label>
        <div class="auth-input-group">
          <i class="bi bi-shield-check auth-input-icon"></i>
          <input type="password" class="form-control" id="reg-confirm-password" name="confirmPassword" placeholder="••••••••" required>
          <button type="button" class="auth-toggle-pass" onclick="togglePasswordVisibility('reg-confirm-password', this)" title="Toggle Password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="terms-check" name="terms" checked required>
        <label class="form-check-label small text-muted" for="terms-check">I agree to the <a href="#" class="text-success fw-bold text-decoration-none">Terms of Service</a> & <a href="#" class="text-success fw-bold text-decoration-none">Privacy Policy</a></label>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-3 fw-bold fs-6 mb-3 shadow-sm">
        Create Free Account <i class="bi bi-person-check ms-1"></i>
      </button>
    </form>

    <!-- Social Logins -->
    <div class="d-flex align-items-center my-3 text-muted small">
      <div class="flex-grow-1 border-top"></div>
      <span class="px-3">or continue with</span>
      <div class="flex-grow-1 border-top"></div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <button type="button" class="social-btn w-100 btn btn-outline-light text-dark border py-2" onclick="socialAuthLogin('Google')">
          <i class="bi bi-google text-danger me-1"></i> Google
        </button>
      </div>
      <div class="col-6">
        <button type="button" class="social-btn w-100 btn btn-outline-light text-dark border py-2" onclick="socialAuthLogin('Apple')">
          <i class="bi bi-apple me-1"></i> Apple
        </button>
      </div>
    </div>

    <div class="text-center mt-3">
      <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-success fw-bold text-decoration-none">Sign In Here</a></p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function togglePasswordVisibility(fieldId, btnEl) {
      const field = document.getElementById(fieldId);
      const icon = btnEl.querySelector("i");
      if (field.type === "password") {
        field.type = "text";
        icon.className = "bi bi-eye-slash";
      } else {
        field.type = "password";
        icon.className = "bi bi-eye";
      }
    }

    function socialAuthLogin(provider) {
      const demoUser = { name: "Sarah Miller", email: "sarah.miller@example.com", role: "customer" };
      store.login(demoUser);
      showToast(`${provider} account linked! Redirecting...`, "success");
      setTimeout(() => { window.location.href = "index.html"; }, 800);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const regForm = document.getElementById("register-form");
      const alertBox = document.getElementById("alert-msg-box");

      regForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.classList.add("d-none");
        alertBox.className = "alert py-2 px-3 small rounded-3 mb-3 d-none";

        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const phone = document.getElementById("reg-phone").value.trim();
        const password = document.getElementById("reg-password").value;
        const confirmPassword = document.getElementById("reg-confirm-password").value;
        const termsChecked = document.getElementById("terms-check").checked;

        if (!name || !email || !phone || !password) {
          alertBox.textContent = "Please fill out all required fields.";
          alertBox.classList.remove("d-none");
          alertBox.classList.add("alert-danger");
          return;
        }

        if (password.length < 6) {
          alertBox.textContent = "Password must be at least 6 characters long.";
          alertBox.classList.remove("d-none");
          alertBox.classList.add("alert-danger");
          return;
        }

        if (password !== confirmPassword) {
          alertBox.textContent = "Passwords do not match. Please verify.";
          alertBox.classList.remove("d-none");
          alertBox.classList.add("alert-danger");
          return;
        }

        if (!termsChecked) {
          alertBox.textContent = "You must agree to the Terms of Service to continue.";
          alertBox.classList.remove("d-none");
          alertBox.classList.add("alert-danger");
          return;
        }

        // Save Customer Login Session
        store.login({
          name: name,
          email: email,
          phone: phone,
          role: "customer"
        });

        alertBox.textContent = `Account created successfully! Welcome to GroceryGo, ${name}.`;
        alertBox.classList.remove("d-none");
        alertBox.classList.add("alert-success");
        showToast("Registration successful!", "success");

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);
      });
    });
  </script>
</body>
</html>
